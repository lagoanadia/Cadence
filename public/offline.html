<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Cadence</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f7f6f3; color: #1c1b19; text-align: center; padding: 24px; }
      @media (prefers-color-scheme: dark) { body { background: #121211; color: #eeede9; } }
      p { color: #6f6c64; }
      button { margin-top: 16px; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; background: #5b5bd6; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Cadence needs a connection to load your data. Nothing is lost.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
